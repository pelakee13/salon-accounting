{% extends "base.html" %}
{% block content %}
<h1 class="page-title">🔐 تغییر رمز عبور</h1>

<div class="card" style="max-width:480px">
  <h2>رمز عبور جدید خود را تنظیم کنید</h2>
  <form method="POST" onsubmit="return validatePw()">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-row">
      <div class="field">
        <label>رمز عبور فعلی *</label>
        <input type="password" name="current_password" id="cur" required>
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>رمز عبور جدید * (حداقل ۸ کاراکتر، شامل حرف و عدد)</label>
        <input type="password" name="new_password" id="np" required
               pattern="^(?=.*[A-Za-z])(?=.*\d).{8,}$"
               title="حداقل ۸ کاراکتر و شامل حرف و عدد">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>تکرار رمز جدید *</label>
        <input type="password" name="confirm_password" id="cp" required>
      </div>
    </div>
    <div class="form-row">
      <button type="submit" class="btn btn-success">💾 ذخیره تغییرات</button>
      <a href="/dashboard" class="btn btn-secondary">انصراف</a>
    </div>
  </form>
</div>

<script>
function validatePw(){
  const np = document.getElementById('np').value;
  const cp = document.getElementById('cp').value;
  if(np.length < 8){ alert('رمز جدید باید حداقل ۸ کاراکتر باشد'); return false; }
  if(!/[A-Za-z]/.test(np) || !/\d/.test(np)){ alert('رمز جدید باید شامل حرف و عدد باشد'); return false; }
  if(np !== cp){ alert('تکرار رمز مطابقت ندارد'); return false; }
  return true;
}
</script>
{% endblock %}
