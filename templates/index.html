{% extends "base.html" %}
{% block content %}
<h2 style="color:#e91e63;margin-bottom:15px;font-size:28px;font-weight:700;font-family:'Sahel',sans-serif">💇‍♀️ هلیا بیوتی — {{ today }}</h2>

<form method="POST" action="/submit_transaction">
<div class="card">
  <h2>اطلاعات مشتری</h2>
  <div class="form-row">
    <div class="field"><label>نام مشتری *</label>
      <select name="customer_name" id="customer_select" required onchange="fillCustomerPhone()">
        <option value="">-- انتخاب یا تایپ نام --</option>
      </select>
      <input name="customer_name_manual" id="customer_name_manual" placeholder="یا نام جدید را تایپ کنید" style="margin-top:5px;display:none" oninput="document.getElementById('customer_select').value=''">
    </div>
    <div class="field"><label>📱 تلفن</label><input name="customer_phone" placeholder="شماره تلفن"></div>
  </div>
</div>

<div class="card">
  <h2>خدمات انجام شده</h2>
  <div id="items_list"></div>
  <div class="form-row" style="margin-top:10px">
    <div class="field"><label>خدمت</label>
      <select id="svc_select" onchange="fillPrice()">
        {% for s in services %}<option value="{{ s.name }}" data-price="{{ s.default_price }}">{{ s.name }} - {{ "{:,}".format(s.default_price) }} تومان</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>کارمند</label>
      <select id="emp_select">
        {% for e in employees %}<option value="{{ e.name }} ({{ e.specialty }})">{{ e.name }} ({{ e.specialty }})</option>{% endfor %}
      </select>
    </div>
    <div class="field" style="max-width:160px"><label>مبلغ (تومان)</label><input type="number" id="amt_input" min="0"></div>
    <div><label>&nbsp;</label><button type="button" class="btn btn-primary" onclick="addItem()">➕ افزودن</button></div>
  </div>

  <table style="margin-top:10px" id="items_table">
    <thead><tr><th>خدمت</th><th>کارمند</th><th>مبلغ</th><th>حذف</th></tr></thead>
    <tbody id="items_tbody"></tbody>
  </table>

  <div style="text-align:left;margin-top:10px">
    <span style="font-size:18px;font-weight:bold;color:#2e7d32">جمع کل: <span id="total_display">۰</span> تومان</span>
  </div>
</div>

<div style="display:flex;gap:10px;margin-top:10px">
  <button type="submit" class="btn btn-success" style="font-size:15px;padding:12px 30px">✅ ثبت نهایی</button>
  <button type="button" class="btn btn-secondary" onclick="clearAll()">🗑️ پاک کردن</button>
</div>
</form>

<script>
let customersData = [];
let items = [];

// Load customers list
fetch('/api/customers').then(r=>r.json()).then(data=>{
  customersData = data;
  let sel = document.getElementById('customer_select');
  data.forEach(c=>{
    let opt = document.createElement('option');
    opt.value = c.name;
    opt.textContent = c.name + (c.phone ? ' (' + c.phone + ')' : '');
    sel.appendChild(opt);
  });
});

function fillCustomerPhone(){
  let sel = document.getElementById('customer_select');
  let phoneInput = document.querySelector('input[name="customer_phone"]');
  let manualInput = document.getElementById('customer_name_manual');
  if(sel.value){
    let cust = customersData.find(c=>c.name===sel.value);
    if(cust) phoneInput.value = cust.phone || '';
    manualInput.style.display = 'none';
  } else {
    manualInput.style.display = 'block';
    phoneInput.value = '';
  }
}

function fillPrice(){
  let s = document.getElementById('svc_select');
  let p = s.options[s.selectedIndex].getAttribute('data-price');
  document.getElementById('amt_input').value = p;
}
function addItem(){
  let svc = document.getElementById('svc_select');
  let emp = document.getElementById('emp_select');
  let amt = document.getElementById('amt_input').value;
  if(!amt || parseInt(amt)<=0){alert('لطفاً مبلغ وارد کنید');return;}
  items.push({service:svc.value, employee:emp.value, amount:parseInt(amt)});
  renderItems();
}
function removeItem(i){
  items.splice(i,1);
  renderItems();
}
function renderItems(){
  let tb = document.getElementById('items_tbody');
  let total = 0;
  let html = '';
  items.forEach((it,i)=>{
    total += it.amount;
    html += '<tr><td>'+it.service+'</td><td>'+it.employee.split(' (')[0]+'</td><td>'+it.amount.toLocaleString()+'</td><td><button type="button" class="btn btn-danger" onclick="removeItem('+i+')" style="padding:3px 8px">❌</button></td></tr>';
    html += '<input type="hidden" name="service[]" value="'+it.service+'">';
    html += '<input type="hidden" name="employee[]" value="'+it.employee+'">';
    html += '<input type="hidden" name="amount[]" value="'+it.amount+'">';
  });
  tb.innerHTML = html;
  document.getElementById('total_display').textContent = total.toLocaleString();
}
function clearAll(){
  items = [];
  renderItems();
  document.getElementById('total_display').textContent = '۰';
}
fillPrice();
</script>
{% endblock %}
