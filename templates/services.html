{% extends "base.html" %}
{% block content %}
<h1 class="page-title">🛎️ مدیریت خدمات</h1>

<div class="card">
  <table>
    <thead><tr><th>نام خدمت</th><th>دسته‌بندی</th><th>قیمت پیش‌فرض</th><th>عملیات</th></tr></thead>
    <tbody>
    {% for s in services %}
    <tr>
      <td><strong>{{ s.name }}</strong></td><td>{{ s.category }}</td><td style="font-weight:600;color:var(--primary)">{{ "{:,}".format(s.default_price) }} تومان</td>
      <td style="white-space:nowrap">
        <button class="btn btn-secondary btn-sm" onclick="editSvc({{ loop.index0 }},'{{ s.name }}','{{ s.category }}',{{ s.default_price }})">✏️</button>
        <form method="POST" style="display:inline" onsubmit="return confirm('حذف {{ s.name }}؟')">
          <input type="hidden" name="action" value="delete"><input type="hidden" name="idx" value="{{ loop.index0 }}">
          <button class="btn btn-danger btn-sm">❌</button>
        </form>
      </td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
  {% if not services %}<div class="empty">خدمتی ثبت نشده</div>{% endif %}
</div>

<button class="btn btn-primary" style="position:fixed;bottom:24px;left:24px;padding:14px 24px;border-radius:50px;box-shadow:var(--shadow-lg)" onclick="openAdd()">➕ افزودن خدمت</button>

<div id="modal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modal_title">افزودن خدمت</h3>
    <form method="POST">
      <input type="hidden" name="action" id="f_action" value="add">
      <input type="hidden" name="idx" id="f_idx" value="">
      <label>نام خدمت *</label><input name="name" id="f_name" required>
      <label>دسته‌بندی</label>
      <select name="category" id="f_category"><option value="">---</option><option>مو</option><option>ناخن</option><option>ابرو</option><option>مژه</option><option>صورت</option></select>
      <label>قیمت پیش‌فرض (تومان)</label><input type="number" name="price" id="f_price" min="0">
      <div class="modal-actions">
        <button type="submit" class="btn btn-success">ذخیره</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal()">لغو</button>
      </div>
    </form>
  </div>
</div>

<script>
function openAdd(){
  document.getElementById('f_action').value='add';
  document.getElementById('modal_title').textContent='افزودن خدمت';
  document.getElementById('f_name').value='';document.getElementById('f_category').value='';
  document.getElementById('f_price').value='';document.getElementById('f_idx').value='';
  document.getElementById('modal').style.display='flex';
}
function editSvc(i,name,cat,price){
  document.getElementById('f_action').value='edit';
  document.getElementById('modal_title').textContent='ویرایش خدمت';
  document.getElementById('f_idx').value=i;
  document.getElementById('f_name').value=name;document.getElementById('f_category').value=cat;
  document.getElementById('f_price').value=price;
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
</script>
{% endblock %}
