<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود — آکادمی هلیا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fce4ec 0%,#f8bbd0 30%,#f48fb1 60%,#ec407a 100%);
  overflow:hidden;position:relative;
}
.bg-circle{position:absolute;border-radius:50%;background:rgba(255,255,255,0.08);animation:float 20s infinite ease-in-out}
.bg-circle:nth-child(1){width:400px;height:400px;top:-100px;right:-100px}
.bg-circle:nth-child(2){width:300px;height:300px;bottom:-80px;left:-80px;animation-delay:-5s}
.bg-circle:nth-child(3){width:200px;height:200px;top:40%;left:10%;animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-20px,20px) scale(0.95)}}
.login-card{
  background:linear-gradient(135deg,#ffffff 0%,#fce4ec 100%);
  border-radius:24px;padding:48px 40px;width:380px;max-width:90vw;
  box-shadow:0 20px 60px rgba(0,0,0,0.15);text-align:center;position:relative;z-index:10;
  animation:cardEntry 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes cardEntry{from{opacity:0;transform:translateY(40px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.logo{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#d81b60 0%,#ad1457 100%);
  display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 8px 24px rgba(216,27,96,0.3)}
.logo span{font-size:42px;color:#fff;font-weight:700;line-height:1}
.title{font-size:26px;font-weight:700;color:#1a1a2e;margin-bottom:8px}
.subtitle{font-size:14px;color:#5f6368;margin-bottom:28px}
.field{margin-bottom:16px;text-align:right}
.field label{display:block;font-size:13px;color:#5f6368;margin-bottom:6px;font-weight:500}
.field input,.field select{width:100%;padding:14px 16px;border:2px solid #e8eaed;border-radius:12px;
  font-family:'Vazirmatn',sans-serif;font-size:15px;background:#fff;color:#1a1a2e;text-align:right;transition:all 0.3s}
.field input:focus,.field select:focus{outline:none;border-color:#d81b60;box-shadow:0 0 0 4px rgba(216,27,96,0.1)}
.submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,#43a047 0%,#2e7d32 100%);color:#fff;
  border:none;border-radius:12px;font-family:'Vazirmatn',sans-serif;font-size:16px;font-weight:600;cursor:pointer;
  transition:all 0.3s;box-shadow:0 4px 16px rgba(46,125,50,0.3)}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,125,50,0.4)}
.submit-btn:active{transform:translateY(0)}
.flash{padding:11px 14px;border-radius:10px;margin-bottom:16px;font-size:13px;font-weight:500}
.flash.error{background:#fce8e6;color:#c5221f;border:1px solid #f5c2c7}
.flash.success{background:#e6f4ea;color:#137333;border:1px solid #ceead6}
.flash.info{background:#e8f0fe;color:#174ea6;border:1px solid #c6dafc}
.footer{margin-top:20px;font-size:12px;color:#9aa0a6}
.hint{margin-top:10px;font-size:11px;color:#b0b0b0}
</style>
</head>
<body>
<div class="bg-circle"></div><div class="bg-circle"></div><div class="bg-circle"></div>
<div class="login-card">
  <div class="logo"><span>AH</span></div>
  <h1 class="title">آکادمی هلیا</h1>
  <p class="subtitle">سیستم مدیریت سالن زیبایی</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}{% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
  {% endwith %}

  <form method="POST" id="loginForm" onsubmit="return validateLogin()">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label>نام کاربری</label>
      <input name="username" placeholder="نام کاربری" required autofocus>
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" name="password" placeholder="رمز عبور" required>
    </div>
    <button type="submit" class="submit-btn">ورود به پنل</button>
  </form>
  <div class="footer">طراحی و اجرا: امین مغربی</div>
</div>
<script>
function validateLogin(){
  const u = document.querySelector('input[name=username]').value.trim();
  const p = document.querySelector('input[name=password]').value;
  if(!u || !p){ alert('نام کاربری و رمز عبور الزامی است'); return false; }
  return true;
}
</script>
</body>
</html>
