{% extends "base.html" %}
{% block content %}
<h1 class="page-title">👥 مدیریت کارمندان</h1>

<div class="card">
  <table>
    <thead><tr><th>نام</th><th>تخصص</th><th>تلفن</th><th>درصد سهم</th><th>عملیات</th></tr></thead>
    <tbody>
    {% for e in employees %}
    <tr>
      <td><strong>{{ e.name }}</strong></td><td>{{ e.specialty }}</td><td>{{ e.phone }}</td><td>{{ e.share_percent }}%</td>
      <td style="white-space:nowrap">
        <button class="btn btn-secondary btn-sm" onclick="editEmp({{ loop.index0 }},'{{ e.name }}','{{ e.specialty }}','{{ e.phone }}',{{ e.share_percent }})">✏️</button>
        <form method="POST" style="display:inline" onsubmit="return confirm('حذف {{ e.name }}؟')">
          <input type="hidden" name="action" value="delete"><input type="hidden" name="idx" value="{{ loop.index0 }}">
          <button class="btn btn-danger btn-sm">❌</button>
        </form>
      </td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
  {% if not employees %}<div class="empty">کارمندی ثبت نشده</div>{% endif %}
</div>

<button class="btn btn-primary" style="position:fixed;bottom:24px;left:24px;padding:14px 24px;border-radius:50px;box-shadow:var(--shadow-lg)" onclick="openAdd()">➕ افزودن کارمند</button>

<div id="modal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modal_title">افزودن کارمند</h3>
    <form method="POST">
      <input type="hidden" name="action" id="f_action" value="add">
      <input type="hidden" name="idx" id="f_idx" value="">
      <label>نام *</label><input name="name" id="f_name" required>
      <label>تخصص</label>
      <select name="specialty" id="f_specialty"><option value="">---</option><option>مو</option><option>ناخن</option><option>ابرو</option><option>مژه</option><option>صورت</option></select>
      <label>تلفن</label><input name="phone" id="f_phone">
      <label>درصد سهم (پورسانت)</label><input type="number" name="share" id="f_share" value="0" min="0" max="100">
      <div class="modal-actions">
        <button type="submit" class="btn btn-success">ذخیره</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal()">لغو</button>
      </div>
    </form>
  </div>
</div>

<script>
function openAdd(){
  document.getElementById('f_action').value='add';
  document.getElementById('modal_title').textContent='افزودن کارمند';
  document.getElementById('f_name').value='';document.getElementById('f_specialty').value='';
  document.getElementById('f_phone').value='';document.getElementById('f_share').value='0';
  document.getElementById('f_idx').value='';
  document.getElementById('modal').style.display='flex';
}
function editEmp(i,name,spec,phone,share){
  document.getElementById('f_action').value='edit';
  document.getElementById('modal_title').textContent='ویرایش کارمند';
  document.getElementById('f_idx').value=i;
  document.getElementById('f_name').value=name;document.getElementById('f_specialty').value=spec;
  document.getElementById('f_phone').value=phone;document.getElementById('f_share').value=share;
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
</script>
{% endblock %}
